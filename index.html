<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDO - Tracker de Navios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            margin: 20px;
            padding: 0;
        }
        h1, h2 {
            color: #4da6ff;
        }
        .card {
            background-color: #2b2b40;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        select, input, button {
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #3b3b54;
            color: #fff;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #4da6ff;
            color: #1e1e2f;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            border: none;
        }
        button:hover {
            background-color: #3385d6;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #444;
        }
        th {
            background-color: #3b3b54;
            color: #4da6ff;
        }
        .progress-bar {
            background-color: #444;
            border-radius: 5px;
            overflow: hidden;
            height: 15px;
            width: 100%;
            margin-top: 5px;
        }
        .progress {
            background-color: #4caf50;
            height: 100%;
            width: 0%;
        }
        .delete-btn {
            background-color: #ff4d4d;
            width: auto;
            padding: 5px 10px;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>Tracker de Construção Naval - BDO</h1>

    <!-- Seleção e Formulário -->
    <div class="card">
        <h2>Adicionar / Atualizar Progresso</h2>
        
        <label for="shipSelect">1. Selecione o Navio:</label>
        <select id="shipSelect" onchange="updateResourceList()">
            <option value="Caravela de Epheria">Navio Mercante de Epheria (T4)</option>
            <option value="Galeão de Epheria">Contratorpedeiro de Epheria (T4)</option>
            <option value="Carraca: Avanço">Carraca: Bravura</option>
            <option value="Carraca: Equilíbrio">Carraca: Equilíbrio</option>
            <option value="Carraca: Volante">Carraca: Emergência</option>
            <option value="Carraca: Valor">Carraca: Gradual</option>
        </select>

        <label for="resourceSelect">2. Selecione o Recurso:</label>
        <select id="resourceSelect" onchange="updateRequiredQty()">
            <!-- Preenchido via JavaScript de acordo com o navio -->
        </select>

        <label for="requiredQty">Quantidade Necessária (Total):</label>
        <input type="number" id="requiredQty" readonly style="opacity: 0.7; cursor: not-allowed;">

        <label for="currentQty">Quantidade que Você Já Tem:</label>
        <input type="number" id="currentQty" placeholder="Ex: 50">

        <button onclick="addResource()">Atualizar Progresso</button>
    </div>

    <!-- Lista de Recursos Salvos -->
    <div class="card">
        <h2>Seus Recursos em Progresso</h2>
        <table>
            <thead>
                <tr>
                    <th>Navio</th>
                    <th>Recurso</th>
                    <th>Possuído</th>
                    <th>Necessário</th>
                    <th>Falta</th>
                    <th>Progresso</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="resourceList">
                <!-- Linhas inseridas dinamicamente -->
            </tbody>
        </table>
    </div>

    <script>
        // Banco de Dados de Materiais do BDO
        const bdoDatabase = {
            "Caravela de Epheria": [
                { name: "Licença: Navio Mercante de Epheria", qty: 1 },
                { name: "+10 Epheria: Proa Velha", qty: 1 },
                { name: "+10 Epheria: Casco Velho", qty: 1 },
                { name: "+10 Epheria: Canhão Velho", qty: 1 },
                { name: "+10 Epheria: Vela de Vento Velha", qty: 1 },
                { name: "Barra de Grafite para Expansão", qty: 100 },
                { name: "Madeira para Expansão", qty: 100 },
                { name: "Cola para Expansão", qty: 100 },
                { name: "Madeira Compensada Revestida de Rubus", qty: 100 },
                { name: "Barra de Sal Gema", qty: 100 },
                { name: "Cola com Memórias do Mar Profundo", qty: 4 },
                { name: "Caule de Alga Profunda", qty: 4 }
            ],
            "Galeão de Epheria": [
                { name: "Licença: Contratorpedeiro de Epheria", qty: 1 },
                { name: "+10 Epheria: Proa Velha", qty: 1 },
                { name: "+10 Epheria: Casco Velho", qty: 1 },
                { name: "+10 Epheria: Canhão Velho", qty: 1 },
                { name: "+10 Epheria: Vela de Vento Velha", qty: 1 },
                { name: "Barra de Grafite para Expansão", qty: 100 },
                { name: "Madeira para Expansão", qty: 100 },
                { name: "Cola para Expansão", qty: 100 },
                { name: "Madeira Compensada Revestida de Rubus", qty: 100 },
                { name: "Madeira de Construção com um brilho de onda", qty: 3 },
                { name: "Barra de Cobalto", qty: 2 },
                { name: "Madeira Compensada Gravada com Escama da Lua", qty: 10 },
                { name: "Caule de Alga Profunda", qty: 4}
            ],
            "Carraca: Avanço": [
                { name: "+10 Navio Mercante de Epheria: Proa de Dragão Negro", qty: 1 },
                { name: "+10 Navio Mercante de Epheria: Casco Refinado", qty: 1 },
                { name: "+10 Navio Mercante de Epheria: Canhão Meina", qty: 1 },
                { name: "+10 Navio Mercante de Epheria: Vela de Camada", qty: 1 },
                { name: "Tecido de Linho com a veia da lua gravada", qty: 180 },
                { name: "Madeira de Construção Envolto com um Brilho Azul Marinho", qty: 170 },
                { name: "Barra de Sal de Rocha Exuberante", qty: 30 },
                { name: "Cristal de Pérola Brilhante", qty: 30 },
                { name: "Olho Abissal", qty: 42 }
            ],
            "Carraca: Equilíbrio": [
                { name: "+10 Navio Mercante de Epheria: Proa de Dragão Negro", qty: 1 },
                { name: "+10 Navio Mercante de Epheria: Casco Refinado", qty: 1 },
                { name: "+10 Navio Mercante de Epheria: Canhão Meina", qty: 1 },
                { name: "+10 Navio Mercante de Epheria: Vela de Camada", qty: 1 },
                { name: "Tecido de Linho com a veia da lua gravada", qty: 180 },
                { name: "Madeira de Construção Envolto com um Brilho Azul Marinho", qty: 144 },
                { name: "Barra de Sal de Rocha Exuberante", qty: 30 },
                { name: "Cristal de Pérola Brilhante", qty: 30 },
                { name: "Olho Abissal", qty: 50 }
            ],
            "Carraca: Volante": [
                { name: "+10 Contratorpedeiro de Epheria: Proa de Dragão Negro", qty: 1 },
                { name: "+10 Contratorpedeiro de Epheria: Casco Refinado", qty: 1 },
                { name: "+10 Contratorpedeiro de Epheria: Canhão Meina", qty: 1 },
                { name: "+10 Contratorpedeiro de Epheria: Vela de Camada", qty: 1 },
                { name: "Tecido de Linho com a veia da lua gravada", qty: 210 },
                { name: "Madeira de Construção Envolto com um Brilho Azul Marinho", qty: 144 },
                { name: "Barra de Sal de Rocha Exuberante", qty: 30 },
                { name: "Cristal de Pérola Brilhante", qty: 30 },
                { name: "Olho Abissal", qty: 42 }
            ],
            "Carraca: Valor": [
                { name: "+10 Navio Mercante de Epheria: Proa de Dragão Negro", qty: 1 },
                { name: "+10 Navio Mercante de Epheria: Casco Refinado", qty: 1 },
                { name: "+10 Navio Mercante de Epheria: Canhão Meina", qty: 1 },
                { name: "+10 Navio Mercante de Epheria: Vela de Camada ", qty: 1 },
                { name: "Tecido de Linho com a veia da lua gravada", qty: 180 },
                { name: "Madeira de Construção Envolto com um Brilho Azul Marinho", qty: 144 },
                { name: "Barra de Sal de Rocha Exuberante", qty: 35 },
                { name: "Cristal de Pérola Brilhante", qty: 35 },
                { name: "Olho Abissal", qty: 42 }
            ]
        };

        let resources = JSON.parse(localStorage.getItem('bdo_resources')) || [];

        // Atualiza a lista de recursos de acordo com o navio selecionado
        function updateResourceList() {
            const ship = document.getElementById('shipSelect').value;
            const resourceSelect = document.getElementById('resourceSelect');
            resourceSelect.innerHTML = '';

            const items = bdoDatabase[ship] || [];
            items.forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = item.name;
                opt.textContent = item.name;
                opt.dataset.qty = item.qty;
                resourceSelect.appendChild(opt);
            });

            updateRequiredQty();
        }

        // Preenche o campo "Quantidade Necessária" automaticamente
        function updateRequiredQty() {
            const resourceSelect = document.getElementById('resourceSelect');
            const selectedOption = resourceSelect.options[resourceSelect.selectedIndex];
            
            if (selectedOption) {
                document.getElementById('requiredQty').value = selectedOption.dataset.qty;
            } else {
                document.getElementById('requiredQty').value = '';
            }
        }

        function saveToStorage() {
            localStorage.setItem('bdo_resources', JSON.stringify(resources));
            renderTable();
        }

        function addResource() {
            const ship = document.getElementById('shipSelect').value;
            const name = document.getElementById('resourceSelect').value;
            const required = parseInt(document.getElementById('requiredQty').value);
            const current = parseInt(document.getElementById('currentQty').value) || 0;

            if (!name || isNaN(required)) {
                alert('Selecione um recurso válido.');
                return;
            }

            // Procura se já existe esse item no tracker
            const existingIndex = resources.findIndex(r => r.ship === ship && r.name === name);

            if (existingIndex > -1) {
                resources[existingIndex].current = current;
                resources[existingIndex].required = required;
            } else {
                resources.push({ ship, name, required, current });
            }

            document.getElementById('currentQty').value = '';

            saveToStorage();
        }

        function deleteResource(index) {
            resources.splice(index, 1);
            saveToStorage();
        }

        function renderTable() {
            const tbody = document.getElementById('resourceList');
            tbody.innerHTML = '';

            resources.forEach((item, index) => {
                const missing = Math.max(0, item.required - item.current);
                const percent = Math.min(100, Math.round((item.current / item.required) * 100)) || 0;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.ship}</td>
                    <td>${item.name}</td>
                    <td>${item.current}</td>
                    <td>${item.required}</td>
                    <td><strong style="color: ${missing === 0 ? '#4caf50' : '#ff4d4d'}">${missing}</strong></td>
                    <td>
                        ${percent}%
                        <div class="progress-bar">
                            <div class="progress" style="width: ${percent}%;"></div>
                        </div>
                    </td>
                    <td><button class="delete-btn" onclick="deleteResource(${index})">Remover</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Inicialização
        updateResourceList();
        renderTable();
    </script>
</body>
</html>
